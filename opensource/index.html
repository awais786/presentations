<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arbisoft Open Source Contributions</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0f172a;
            --bg-light: #1e293b;
            --primary-blue: #3b82f6;
            --accent-start: #60a5fa;
            --accent-end: #a78bfa;
            --text-primary: #f8fafc;
            --text-secondary: #cbd5e1;
            --text-muted: #94a3b8;
            --text-dim: #64748b;
            --card-bg: rgba(30, 41, 59, 0.5);
            --card-border: rgba(255, 255, 255, 0.08);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, var(--bg-dark) 0%, var(--bg-light) 100%);
            color: var(--text-primary);
            line-height: 1.6;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Grid overlay */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image:
                linear-gradient(0deg, transparent 24%, rgba(255,255,255,0.03) 25%, rgba(255,255,255,0.03) 26%, transparent 27%, transparent 74%, rgba(255,255,255,0.03) 75%, rgba(255,255,255,0.03) 76%, transparent 77%, transparent),
                linear-gradient(90deg, transparent 24%, rgba(255,255,255,0.03) 25%, rgba(255,255,255,0.03) 26%, transparent 27%, transparent 74%, rgba(255,255,255,0.03) 75%, rgba(255,255,255,0.03) 76%, transparent 77%, transparent);
            background-size: 40px 40px;
            pointer-events: none;
            z-index: 0;
        }

        main {
            position: relative;
            z-index: 1;
            max-width: 1240px;
            margin: 0 auto;
            padding: 80px 40px;
        }

        /* Hero section */
        .hero {
            text-align: center;
            margin-bottom: 60px;
            padding: 80px 40px;
            background: linear-gradient(135deg, rgba(59, 130, 246, 0.05), rgba(167, 139, 250, 0.05));
            border: 1px solid var(--card-border);
            border-radius: 16px;
            position: relative;
            overflow: hidden;
        }

        .hero::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(96, 165, 250, 0.1) 0%, transparent 70%);
            pointer-events: none;
        }

        .hero > * {
            position: relative;
            z-index: 1;
        }

        .hero-stat {
            font-size: clamp(2.8rem, 6vw, 4rem);
            font-weight: 800;
            background: linear-gradient(90deg, var(--accent-start), var(--accent-end));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 16px;
            letter-spacing: -0.02em;
        }

        .hero-subtitle {
            font-size: 1.25rem;
            color: var(--text-secondary);
            margin-bottom: 8px;
            font-weight: 500;
        }

        .hero-window {
            font-size: 0.95rem;
            color: var(--text-muted);
            margin-bottom: 50px;
            font-weight: 500;
        }

        .stat-band {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 16px;
            margin-top: 20px;
        }

        .stat-item {
            background: linear-gradient(135deg, rgba(59, 130, 246, 0.1), rgba(167, 139, 250, 0.1));
            border: 1px solid rgba(96, 165, 250, 0.2);
            padding: 24px 16px;
            border-radius: 12px;
            text-align: center;
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
        }

        .stat-item:hover {
            border-color: rgba(96, 165, 250, 0.4);
            background: linear-gradient(135deg, rgba(59, 130, 246, 0.15), rgba(167, 139, 250, 0.15));
            transform: translateY(-4px);
        }

        .stat-number {
            font-size: 2.4rem;
            font-weight: 800;
            background: linear-gradient(90deg, var(--accent-start), var(--accent-end));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            display: block;
        }

        .stat-label {
            font-size: 0.85rem;
            color: var(--text-secondary);
            margin-top: 8px;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        /* Section headers */
        .section {
            margin-bottom: 80px;
            scroll-margin-top: 100px;
        }

        .section-header {
            margin-bottom: 40px;
        }

        .section-number {
            font-size: 0.75rem;
            color: var(--primary-blue);
            font-weight: 700;
            letter-spacing: 0.1em;
            margin-bottom: 8px;
            text-transform: uppercase;
        }

        .section-title {
            font-size: clamp(1.8rem, 4vw, 2.4rem);
            font-weight: 800;
            margin-bottom: 12px;
            background: linear-gradient(90deg, var(--text-primary), var(--text-secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .section-description {
            font-size: 1rem;
            color: var(--text-secondary);
            margin-bottom: 0;
            max-width: 650px;
            line-height: 1.6;
        }

        /* Logos section */
        .logo-section {
            background: linear-gradient(135deg, rgba(59, 130, 246, 0.05), rgba(167, 139, 250, 0.05));
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 50px 40px;
            margin: 60px 0;
        }

        .logo-section-label {
            font-size: 0.85rem;
            color: var(--primary-blue);
            font-weight: 700;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            margin-bottom: 8px;
            display: block;
        }

        .logo-section-title {
            font-size: 1.6rem;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 36px;
        }

        .logo-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
            gap: 20px;
        }

        .logo-item {
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, rgba(59, 130, 246, 0.1), rgba(167, 139, 250, 0.1));
            border: 1px solid rgba(96, 165, 250, 0.2);
            padding: 24px;
            border-radius: 12px;
            min-height: 120px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            color: var(--text-primary);
            backdrop-filter: blur(10px);
            position: relative;
            overflow: hidden;
        }

        .logo-item::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(135deg, rgba(96, 165, 250, 0.1), transparent);
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .logo-item:hover {
            background: linear-gradient(135deg, rgba(59, 130, 246, 0.15), rgba(167, 139, 250, 0.15));
            border-color: rgba(96, 165, 250, 0.4);
            transform: translateY(-6px);
            box-shadow: 0 12px 24px rgba(96, 165, 250, 0.15);
        }

        .logo-item:hover::before {
            opacity: 1;
        }

        .logo-item > div {
            position: relative;
            z-index: 1;
        }

        .logo-item img {
            max-width: 80px;
            max-height: 60px;
            object-fit: contain;
        }

        .logo-text {
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text-secondary);
            margin-top: 8px;
        }

        /* Responsive */
        @media (max-width: 1024px) {
            main {
                padding: 60px 32px;
            }

            .hero {
                padding: 60px 32px;
            }

            .logo-section {
                padding: 40px 32px;
            }
        }

        @media (max-width: 768px) {
            main {
                padding: 40px 20px;
            }

            .hero {
                padding: 50px 24px;
                border-radius: 12px;
            }

            .hero-stat {
                font-size: 2.2rem;
            }

            .stat-band {
                grid-template-columns: repeat(2, 1fr);
                gap: 12px;
            }

            .section-title {
                font-size: 1.6rem;
            }

            .section-header {
                margin-bottom: 32px;
            }

            .logo-grid {
                grid-template-columns: repeat(auto-fit, minmax(110px, 1fr));
                gap: 12px;
            }

            .logo-section {
                padding: 32px 20px;
            }

            footer {
                padding: 32px 20px !important;
            }
        }

        @media (max-width: 480px) {
            main {
                padding: 32px 16px;
            }

            .hero {
                padding: 40px 16px;
            }

            .hero-stat {
                font-size: 1.8rem;
            }

            .stat-band {
                grid-template-columns: 1fr;
                gap: 12px;
            }

            .section-title {
                font-size: 1.4rem;
            }

            .logo-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>
<body>
    <main>
        <div class="hero" id="hero">
            <!-- Populated by JS -->
        </div>

        <div id="content">
            <!-- Populated by JS -->
        </div>

        <footer style="margin-top: 100px; padding: 50px 40px; border-top: 1px solid var(--card-border); color: var(--text-dim); font-size: 0.9rem; background: linear-gradient(135deg, rgba(59, 130, 246, 0.03), rgba(167, 139, 250, 0.03)); border-radius: 12px;">
            <p style="margin-bottom: 16px; color: var(--text-secondary);">
                <strong>Methodology:</strong> Merged PRs authored by 6 team members across public repositories, last 365 days from script run date.
                Not counted: code reviews, commits outside PRs, private repos, unpublished work.
            </p>
            <p>
                Updated: <span id="updated-date" style="color: var(--text-primary); font-weight: 600;"></span> -
                <a href="https://github.com/awais786/presentations" style="color: var(--primary-blue); text-decoration: none; font-weight: 600; transition: color 0.2s;" onmouseover="this.style.color='var(--accent-start)'" onmouseout="this.style.color='var(--primary-blue)'">View source</a>
            </p>
        </footer>
    </main>

    <script>
        // Data loaded inline at render time
        const data = {/* will be populated */};

        async function init() {
            try {
                const response = await fetch('contributions.json');
                const json = await response.json();
                renderPage(json);
            } catch (e) {
                console.error('Failed to load contributions.json:', e);
                document.getElementById('content').innerHTML = '<p style="color: var(--text-dim);">Error loading data</p>';
            }
        }

        function renderPage(data) {
            renderHero(data);
            renderHighlights();
            renderLogos();
            renderTiers(data);
            renderLedger(data);
            updateTimestamp(data);
        }

        function renderHero(data) {
            const heroEl = document.getElementById('hero');
            const t = data.totals;
            const updated = new Date(data.generated);

            heroEl.innerHTML = `
                <div class="hero-stat">${t.prs} merged pull requests</div>
                <div class="hero-subtitle">12 months of open source contributions</div>
                <div class="hero-window">
                    ${data.window.start} through ${data.window.end}
                </div>
                <div class="stat-band">
                    <div class="stat-item">
                        <div class="stat-number">${t.prs}</div>
                        <div class="stat-label">Pull Requests</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-number">${t.repos}</div>
                        <div class="stat-label">Repositories</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-number">${t.orgs}</div>
                        <div class="stat-label">Organizations</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-number">${data.coreContributors.length}</div>
                        <div class="stat-label">Core Contributors</div>
                    </div>
                </div>
            `;
        }

                    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px;">
                        <div style="background: linear-gradient(135deg, rgba(59, 130, 246, 0.1), rgba(167, 139, 250, 0.1)); border: 1px solid rgba(96, 165, 250, 0.2); padding: 24px; border-radius: 12px;">

                        </div>

                            <div style="font-weight: 700; color: var(--text-primary); margin-bottom: 12px; font-size: 1.05rem;">✈️ Plane (24 repos)</div>
                            <ul style="list-style: none; padding: 0; margin: 0; color: var(--text-secondary); font-size: 0.9rem; line-height: 1.8;">
                                <li>✓ Project management platform enhancements</li>
                                <li>✓ Issue tracking & workflow features</li>
                                <li>✓ MCP server integration for AI agents</li>
                                <li>✓ E2E testing & quality automation</li>
                                <li>✓ Developer tooling improvements</li>
                            </ul>
                        </div>
                        <div style="background: linear-gradient(135deg, rgba(59, 130, 246, 0.1), rgba(167, 139, 250, 0.1)); border: 1px solid rgba(96, 165, 250, 0.2); padding: 24px; border-radius: 12px;">
                            <div style="font-weight: 700; color: var(--text-primary); margin-bottom: 12px; font-size: 1.05rem;">🔧 Pressingly Ecosystem</div>
                            <ul style="list-style: none; padding: 0; margin: 0; color: var(--text-secondary); font-size: 0.9rem; line-height: 1.8;">
                                <li>✓ Multiple product integrations</li>
                                <li>✓ AI-powered MCP servers</li>
                                <li>✓ Security & SSO implementations</li>
                                <li>✓ Cross-platform deployment pipelines</li>
                                <li>✓ Infrastructure & DevOps automation</li>
                            </ul>
                        </div>
                        <div style="background: linear-gradient(135deg, rgba(59, 130, 246, 0.1), rgba(167, 139, 250, 0.1)); border: 1px solid rgba(96, 165, 250, 0.2); padding: 24px; border-radius: 12px;">
                            <div style="font-weight: 700; color: var(--text-primary); margin-bottom: 12px; font-size: 1.05rem;">📦 Moneta DevStack (49 repos)</div>
                            <ul style="list-style: none; padding: 0; margin: 0; color: var(--text-secondary); font-size: 0.9rem; line-height: 1.8;">
                                <li>✓ End-to-end testing suite</li>
                                <li>✓ Development environment setup</li>
                                <li>✓ CI/CD pipeline automation</li>
                                <li>✓ Quality assurance frameworks</li>
                                <li>✓ Performance testing & optimization</li>
                            </ul>
                        </div>
                        <div style="background: linear-gradient(135deg, rgba(59, 130, 246, 0.1), rgba(167, 139, 250, 0.1)); border: 1px solid rgba(96, 165, 250, 0.2); padding: 24px; border-radius: 12px;">
                            <div style="font-weight: 700; color: var(--text-primary); margin-bottom: 12px; font-size: 1.05rem;">🎨 Design & Content (Penpot, Outline)</div>
                            <ul style="list-style: none; padding: 0; margin: 0; color: var(--text-secondary); font-size: 0.9rem; line-height: 1.8;">
                                <li>✓ Design collaboration tools</li>
                                <li>✓ Knowledge base systems</li>
                                <li>✓ Documentation infrastructure</li>
                                <li>✓ Team collaboration features</li>
                                <li>✓ Content management enhancements</li>
                            </ul>
                        </div>
                        <div style="background: linear-gradient(135deg, rgba(59, 130, 246, 0.1), rgba(167, 139, 250, 0.1)); border: 1px solid rgba(96, 165, 250, 0.2); padding: 24px; border-radius: 12px;">
                            <div style="font-weight: 700; color: var(--text-primary); margin-bottom: 12px; font-size: 1.05rem;">⚡ Search & Infrastructure</div>
                            <ul style="list-style: none; padding: 0; margin: 0; color: var(--text-secondary); font-size: 0.9rem; line-height: 1.8;">
                                <li>✓ Meilisearch integrations</li>
                                <li>✓ Full-text search implementations</li>
                                <li>✓ Database optimization</li>
                                <li>✓ API performance improvements</li>
                                <li>✓ Scalability enhancements</li>
                            </ul>
                        </div>
                    </div>
                </div>
            `;
            heroEl.insertAdjacentHTML('afterend', highlightsHtml);
        }

        function renderLogos() {
            const contentEl = document.getElementById('content');
            const logosHtml = `
                <div class="logo-section">
                    <span class="logo-section-label">Featured Platforms</span>
                    <h2 class="logo-section-title">Projects We Contribute To</h2>
                    <div class="logo-grid">
                        <a href="https://github.com/openedx" target="_blank" class="logo-item" title="Open edX">
                            <div>
                                <div style="font-size: 1.8rem; font-weight: 700; background: linear-gradient(135deg, #60a5fa, #a78bfa); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; margin-bottom: 4px;">edX</div>
                                <div class="logo-text">Open edX</div>
                            </div>
                        </a>
                        <a href="https://github.com/makeplane/plane" target="_blank" class="logo-item" title="Plane">
                            <div>
                                <div style="font-size: 1.4rem; font-weight: 700; color: var(--primary-blue); margin-bottom: 4px;">✈️</div>
                                <div class="logo-text">Plane</div>
                            </div>
                        </a>
                        <a href="https://github.com/twentyhq/twenty" target="_blank" class="logo-item" title="Twenty">
                            <div>
                                <div style="font-size: 1.6rem; font-weight: 700; color: var(--text-primary); margin-bottom: 4px;">20</div>
                                <div class="logo-text">Twenty</div>
                            </div>
                        </a>
                        <a href="https://github.com/penpot/penpot" target="_blank" class="logo-item" title="Penpot">
                            <div>
                                <div style="font-size: 1.4rem; font-weight: 700; margin-bottom: 4px; background: linear-gradient(135deg, #ff6b6b, #ffd93d); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;">🎨</div>
                                <div class="logo-text">Penpot</div>
                            </div>
                        </a>
                        <a href="https://github.com/outline/outline" target="_blank" class="logo-item" title="Outline">
                            <div>
                                <div style="font-size: 1.4rem; font-weight: 700; color: var(--text-primary); margin-bottom: 4px;">📝</div>
                                <div class="logo-text">Outline</div>
                            </div>
                        </a>
                        <a href="https://github.com/meilisearch/meilisearch" target="_blank" class="logo-item" title="Meilisearch">
                            <div>
                                <div style="font-size: 1.2rem; font-weight: 700; margin-bottom: 4px; background: linear-gradient(135deg, #ff006e, #8338ec); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;">⚡</div>
                                <div class="logo-text">Meilisearch</div>
                            </div>
                        </a>
                        <a href="https://github.com/wagtail/wagtail" target="_blank" class="logo-item" title="Wagtail">
                            <div>
                                <div style="font-size: 1.4rem; font-weight: 700; color: #3b82f6; margin-bottom: 4px;">W</div>
                                <div class="logo-text">Wagtail</div>
                            </div>

                        <a href="https://github.com/django/django" target="_blank" class="logo-item" title="Django">

                            </div>
                        </a>
                    </div>
                </div>
            `;
            contentEl.insertAdjacentHTML('beforebegin', logosHtml);
        }

        function renderTiers(data) {
            const contentEl = document.getElementById('content');
            let html = '';

            data.tiers.forEach((tier, idx) => {
                const num = String(idx + 1).padStart(2, '0');
                html += `
                    <section class="section">
                        <div class="section-header">
                            <span class="section-number">${num}</span>
                            <h2 class="section-title">${tier.name}</h2>
                            <p class="section-description">${tier.description}</p>
                        </div>
                        <div id="tier-${tier.id}"></div>
                    </section>
                `;
            });

            contentEl.innerHTML = html;

            // Render each tier's content
            data.tiers.forEach(tier => {
                const tierEl = document.getElementById(`tier-${tier.id}`);
                if (tier.id === 'maintain') {
                    renderMaintainTier(tierEl, data, tier);
                } else if (tier.id === 'contribute') {
                    renderContributeTier(tierEl, tier);
                } else {
                    renderProjectTier(tierEl, tier);
                }
            });
        }

        function renderMaintainTier(el, data, tier) {
            // Render core contributors badges first
            let html = '<div class="core-contributors" style="margin-bottom: 40px;">';
            html += '<div style="font-size: 0.9rem; color: var(--text-muted); margin-bottom: 16px;">Core Contributors</div>';

            data.coreContributors.forEach(cc => {
                html += `
                    <div style="display: inline-block; background: var(--card-bg); border: 1px solid var(--card-border); padding: 12px 16px; border-radius: 6px; margin-right: 12px; margin-bottom: 12px; font-size: 0.95rem;">
                        <strong style="color: var(--primary-blue);">@${cc.handle}</strong>
                        <span style="color: var(--text-muted);"> - ${cc.role}</span>
                    </div>
                `;
            });
            html += '</div>';

            // Then repo grid
            html += '<div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px;">';
            tier.repos.forEach(repo => {
                html += renderProjectCard(repo, false);
            });
            html += '</div>';

            el.innerHTML = html;
        }

        function renderContributeTier(el, tier) {
            // Badge wall layout
            let html = '<div style="display: flex; flex-wrap: wrap; gap: 12px;">';
            tier.repos.forEach(repo => {
                const repoName = repo.name.split('/').pop();
                html += `
                    <a href="${repo.link}" target="_blank" style="text-decoration: none;">
                        <div style="background: var(--card-bg); border: 1px solid var(--card-border); padding: 12px 16px; border-radius: 6px; font-size: 0.95rem; transition: all 0.2s; display: flex; align-items: center; gap: 8px;">
                            <span style="color: var(--primary-blue); font-weight: 600;">${repoName}</span>
                            <span style="color: var(--text-muted); font-size: 0.85rem;">${repo.prs}</span>
                            <i class="fas fa-external-link" style="color: var(--text-dim); font-size: 0.8rem;"></i>
                        </div>
                    </a>
                `;
            });
            html += '</div>';
            el.innerHTML = html;
        }

        function renderProjectTier(el, tier) {
            // Grid of project cards
            let html = '<div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px;">';
            tier.repos.forEach(repo => {
                html += renderProjectCard(repo, tier.id === 'build-with');
            });
            html += '</div>';
            el.innerHTML = html;
        }

        function getProjectIcon(repoName) {
            const icons = {
                'plane': '✈️',
                'twenty': '20️',
                'penpot': '🎨',
                'outline': '📝',
                'surfsense': '🌊',
                'plane-mcp-server': '✈️',
                'twenty-mcp-server': '20️',
                'outline-mcp-server': '📝',
                'surfsense-mcp-server': '🌊',
                'foss-sso-e2e': '🔐',
                'generative-ai-vdos': '🤖',
                'moneta-devstack-e2e-tests': '✅',
                'policy-chatbot': '💬',
                'wagtail-ai-chat': '💬',
                'hr-assistant': '👔',
            };
            const normalizedName = repoName.toLowerCase().replace('_', '-');
            for (const [key, icon] of Object.entries(icons)) {
                if (normalizedName.includes(key)) {
                    return icon;
                }
            }
            return '📦';
        }

        function renderProjectCard(repo, isBuildWith = false) {
            const name = repo.name.split('/').pop();
            const org = repo.name.split('/')[0];
            const icon = isBuildWith ? getProjectIcon(name) : '';
            const iconHtml = icon ? `<div style="font-size: 3rem; margin-bottom: 16px; line-height: 1; filter: drop-shadow(0 0 8px rgba(96, 165, 250, 0.3));">${icon}</div>` : '';
            const bgStyle = isBuildWith ? 'linear-gradient(135deg, rgba(59, 130, 246, 0.12), rgba(167, 139, 250, 0.12))' : 'var(--card-bg)';
            const borderColor = isBuildWith ? 'rgba(96, 165, 250, 0.25)' : 'var(--card-border)';
            return `
                <a href="${repo.link}" target="_blank" style="text-decoration: none;">
                    <div style="background: ${bgStyle}; border: 1px solid ${borderColor}; padding: 28px 24px; border-radius: 12px; height: 100%; transition: all 0.3s ease; cursor: pointer; display: flex; flex-direction: column; backdrop-filter: blur(10px); position: relative; overflow: hidden;"
                         onmouseover="this.style.background='linear-gradient(135deg, rgba(59, 130, 246, 0.18), rgba(167, 139, 250, 0.18))'; this.style.borderColor='rgba(96, 165, 250, 0.5)'; this.style.transform='translateY(-6px)'; this.style.boxShadow='0 12px 24px rgba(96, 165, 250, 0.2)';"
                         onmouseout="this.style.background='${bgStyle}'; this.style.borderColor='${borderColor}'; this.style.transform='translateY(0)'; this.style.boxShadow='none';">
                        ${iconHtml}
                        <div style="color: var(--text-muted); font-size: 0.8rem; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.05em; font-weight: 600;">${org}</div>
                        <div style="color: var(--text-primary); font-weight: 700; margin-bottom: 16px; word-break: break-word; flex-grow: 1; font-size: 1.05rem; line-height: 1.4;">${name}</div>
                        <div style="display: flex; align-items: baseline; gap: 8px;">
                            <div style="color: var(--accent-start); font-size: 1.8rem; font-weight: 800;">${repo.prs}</div>
                            <div style="color: var(--text-muted); font-size: 0.8rem; font-weight: 500;">PRs</div>
                        </div>
                    </div>
                </a>
            `;
        }

        function renderLedger(data) {
            const contentEl = document.getElementById('content');
            const footer = contentEl.parentElement.querySelector('footer');

            // Collect all repos
            const allRepos = [];
            data.tiers.forEach(tier => {
                tier.repos.forEach(repo => {
                    allRepos.push({
                        name: repo.name,
                        prs: repo.prs,
                        tier: tier.name,
                        link: repo.link,
                    });
                });
            });
            allRepos.sort((a, b) => b.prs - a.prs);

            let html = `
                <section class="section" style="margin-top: 100px;">
                    <div class="section-header">
                        <span class="section-number">05</span>
                        <h2 class="section-title">Complete Ledger</h2>
                        <p class="section-description">All ${allRepos.length} repositories and contribution counts. Click any row to view on GitHub.</p>
                    </div>
                    <button onclick="toggleLedger()" style="background: linear-gradient(135deg, #3b82f6, #a78bfa); color: var(--text-primary); border: none; padding: 14px 28px; border-radius: 8px; cursor: pointer; font-weight: 600; margin-bottom: 24px; font-size: 0.95rem; transition: all 0.3s ease; box-shadow: 0 4px 12px rgba(96, 165, 250, 0.3);" onmouseover="this.style.transform='translateY(-2px)'; this.style.boxShadow='0 6px 20px rgba(96, 165, 250, 0.4)'" onmouseout="this.style.transform='translateY(0)'; this.style.boxShadow='0 4px 12px rgba(96, 165, 250, 0.3)'">
                        <i class="fas fa-table" style="margin-right: 8px;"></i><span id="ledger-toggle-text">Show Full Ledger</span>
                    </button>
                    <div id="ledger-table" style="display: none; overflow-x: auto; background: linear-gradient(135deg, rgba(59, 130, 246, 0.05), rgba(167, 139, 250, 0.05)); border: 1px solid var(--card-border); border-radius: 12px; padding: 20px;">
                        <table style="width: 100%; border-collapse: collapse; font-size: 0.95rem;">
                            <thead>
                                <tr style="border-bottom: 2px solid rgba(96, 165, 250, 0.3);">
                                    <th style="text-align: left; padding: 16px 12px; color: var(--primary-blue); font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; font-size: 0.8rem;">Repository</th>
                                    <th style="text-align: center; padding: 16px 12px; color: var(--primary-blue); font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; font-size: 0.8rem;">PRs</th>
                                    <th style="text-align: left; padding: 16px 12px; color: var(--primary-blue); font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; font-size: 0.8rem;">Category</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${allRepos.map((repo, idx) => `
                                    <tr style="border-bottom: 1px solid rgba(96, 165, 250, 0.1); transition: all 0.2s ease; background: ${idx % 2 === 0 ? 'transparent' : 'rgba(59, 130, 246, 0.05)'};" onmouseover="this.style.background='rgba(96, 165, 250, 0.1)'" onmouseout="this.style.background='${idx % 2 === 0 ? 'transparent' : 'rgba(59, 130, 246, 0.05)'}'">
                                        <td style="padding: 14px 12px;"><a href="${repo.link}" target="_blank" style="color: var(--primary-blue); text-decoration: none; font-weight: 500; transition: color 0.2s;" onmouseover="this.style.color='var(--accent-start)'" onmouseout="this.style.color='var(--primary-blue)'">${repo.name} <i class="fas fa-external-link" style="font-size: 0.7rem; opacity: 0.5; margin-left: 6px;"></i></a></td>
                                        <td style="padding: 14px 12px; text-align: center; color: var(--accent-start); font-weight: 700;">${repo.prs}</td>
                                        <td style="padding: 14px 12px; color: var(--text-secondary); font-size: 0.9rem;">${repo.tier}</td>
                                    </tr>
                                `).join('')}
                            </tbody>
                        </table>
                    </div>
                </section>
            `;

            footer.insertAdjacentHTML('beforebegin', html);
        }

        function toggleLedger() {
            const table = document.getElementById('ledger-table');
            const toggleText = document.getElementById('ledger-toggle-text');
            const isVisible = table.style.display !== 'none';
            table.style.display = isVisible ? 'none' : 'block';
            toggleText.textContent = isVisible ? 'Show Full Ledger' : 'Hide Ledger';
        }

        function updateTimestamp(data) {
            const updated = new Date(data.generated);
            document.getElementById('updated-date').textContent = updated.toLocaleDateString('en-US', {
                year: 'numeric',
                month: 'long',
                day: 'numeric',
                hour: '2-digit',
                minute: '2-digit',
                timeZone: 'UTC',
            }) + ' UTC';
        }

        // Initialize on load
        init();
    </script>
</body>
</html>
